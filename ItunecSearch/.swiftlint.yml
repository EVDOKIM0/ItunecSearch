reporter: "xcode"
included:
    - ItunecSearch
opt_in_rules:
    - closure_spacing
    - large_tuple
    - explicit_init
    - file_name_no_space
    - collection_alignment
    - trailing_closure
    - trailing_whitespace
    - conditional_returns_on_newline
    - redundant_optional_initialization
    - vertical_parameter_alignment_on_call
    - force_unwrapping
    - implicitly_unwrapped_optional
    - operator_usage_whitespace
    - multiline_arguments
    - multiline_arguments_brackets
    - multiline_function_chains
disabled_rules:
    - line_length
    - type_body_length
    - function_body_length
    - file_length
    - cyclomatic_complexity
    - indentation_width
    - closure_body_length
    - identifier_name
    - redundant_type_annotation
    - trailing_comma
    - weak_delegate
    - unused_optional_binding
    - type_contents_order
    - discouraged_optional_boolean
    - type_name
    - function_parameter_count
    - vertical_space_between_nested_types
    - private_outlet
    - private_action
    - file_name_no_space
    - convenience_type
    - reduce_into
    - unavailable_function
conditional_returns_on_newline:
    if_only: true
trailing_closure:
    only_single_muted_parameter: true
    severity: error
vertical_parameter_alignment_on_call:
    severity: error
